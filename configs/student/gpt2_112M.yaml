# GPT-2 112M student (reduced MLP from GPT-2 Small)
# Same hidden size (768) and layers (12) as teacher for projector-free BKD.
# Less aggressive compression than gpt2_96M (n_inner=2400 vs 1536).
short_name: gpt2_112M
base_model: openai-community/gpt2
architecture: from_config
config_overrides:
  n_inner: 2400
