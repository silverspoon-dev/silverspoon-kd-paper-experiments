# DeepSeek-V3-architecture ~96M student (cross-architecture target for GPT-2 teacher)
# MLA attention (kv_lora_rank=96, q_lora_rank=256), RoPE, SiLU — fundamentally
# different from GPT-2's standard MHA + learned positional embeddings + GELU.
# Dense (no MoE) to isolate the attention architecture variable.
short_name: deepseek_v3_96M
base_model: "openai-community/gpt2"
model_type_id: deepseek_v3
architecture: from_config
layer_pattern: 'model\.layers\.(\d+)$'
teacher_layers: [0, 2, 4, 6, 8, 10]  # 6 student layers ← 12 teacher layers (every other)
config_overrides:
  use_cache: false
  hidden_size: 768
  num_hidden_layers: 6
  num_attention_heads: 12
  intermediate_size: 768
  num_key_value_heads: 12
  kv_lora_rank: 96
  q_lora_rank: 256
  qk_nope_head_dim: 64
  qk_rope_head_dim: 32
  v_head_dim: 64
  n_routed_experts: 0
  n_shared_experts: 0
  first_k_dense_replace: 6
  vocab_size: 50257
  max_position_embeddings: 1024
