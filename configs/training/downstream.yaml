# Downstream fine-tuning / distillation training config (TextBrewer-aligned)
batch_size: 128
num_epochs: 30
max_steps: -1
learning_rate: 1e-4
lr_scheduler_type: linear
warmup_ratio: 0.1
max_grad_norm: 1.0
weight_decay: 0.01
metric_for_best_model: eval_accuracy
greater_is_better: true

logging_strategy: steps
logging_steps: 50
report_to: wandb
log_level: warning
disable_tqdm: false
disable_console_logs: true

eval_strategy: epoch
eval_steps: 1
eval_on_start: true

save_strategy: epoch
save_steps: 1
save_total_limit: 1

bf16: true
fp16: false

gradient_checkpointing: false
optim: adamw_torch_fused

torch_compile: false
attn_implementation: sdpa

dataloader_num_workers: 4
dataloader_pin_memory: true
dataloader_prefetch_factor: 4

resume_from_checkpoint: null

enable_profiling: false
profiling_output_dir: null
profiling_wait: 20
profiling_warmup: 3
profiling_active: 3
profiling_repeat: 1
profiling_with_stack: false

early_stopping_patience: 0
early_stopping_threshold: 0.0
