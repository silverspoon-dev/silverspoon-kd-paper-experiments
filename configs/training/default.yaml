# Default training configuration
batch_size: 16
num_epochs: 1
max_steps: -1
learning_rate: 2e-4
lr_scheduler_type: constant_with_warmup
warmup_ratio: 0.1
max_grad_norm: 1.0
weight_decay: 0.0
metric_for_best_model: null
greater_is_better: null

logging_strategy: steps
logging_steps: 10
report_to: wandb
log_level: warning
disable_tqdm: false
disable_console_logs: true

eval_strategy: steps
eval_steps: 1000
eval_on_start: true

save_strategy: steps
save_steps: 1000
save_total_limit: 1

bf16: true
fp16: false

gradient_checkpointing: false
optim: adamw_torch_fused

torch_compile: true
attn_implementation: sdpa

dataloader_num_workers: 8
dataloader_pin_memory: true
dataloader_prefetch_factor: 8

resume_from_checkpoint: null

enable_profiling: false
profiling_output_dir: null
profiling_wait: 20
profiling_warmup: 3
profiling_active: 3
profiling_repeat: 1
profiling_with_stack: false

early_stopping_patience: 0
early_stopping_threshold: 0.0

# Multi-GPU teacher placement (null = auto: replicated on single GPU,
# manual split on multi-GPU). Set to a dict for explicit placement:
#   teacher_placement: {teacher_only_devices: [1], strategy: pp}
teacher_placement: null
